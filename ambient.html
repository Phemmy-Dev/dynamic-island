<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Now Playing</title>
  <link rel="stylesheet" href="ambient.css">
</head>
<body class="no-media no-lyrics">
  <img id="bg" class="bg" alt="">
  <div class="shade"></div>

  <div class="corner">
    <button id="close" class="round" title="Close (Esc)">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <button id="lyrics-toggle" class="round" title="Show or hide lyrics">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12.5h5"/></svg>
    </button>
  </div>

  <header class="time">
    <div id="date" class="date"></div>
    <div id="clock" class="clock"></div>
  </header>

  <main id="stage" class="stage">
    <section class="player">
      <img id="art" class="art" alt="">
      <div class="card">
        <div id="title" class="title"></div>
        <div id="artist" class="artist"></div>
        <div class="progress">
          <span id="elapsed">0:00</span>
          <div class="track"><div id="fill" class="fill"></div></div>
          <span id="remaining">-0:00</span>
        </div>
        <div class="controls">
          <button id="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M11 7.5v9L4.5 12zM19.5 7.5v9L13 12z"/></svg></button>
          <button id="toggle" title="Play/Pause">
            <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 6v12l10-6z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24"><path d="M7 5.5h3v13H7zM14 5.5h3v13h-3z"/></svg>
          </button>
          <button id="next" title="Next"><svg viewBox="0 0 24 24"><path d="M13 7.5v9l6.5-4.5zM4.5 7.5v9L11 12z"/></svg></button>
        </div>
      </div>
    </section>

    <section id="lyrics" class="lyrics">
      <div id="lines" class="lines"></div>
    </section>
  </main>

  <div id="hint" class="hint">Click anywhere or press Esc to close</div>

  <script src="widgets/lrc.js"></script>
  <script src="widgets/flip.js"></script>
  <script src="ambient.js"></script>
</body>
</html>
