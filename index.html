<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Dynamic Island</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- .island draws the curved "shoulders" that join the pill to the screen edge -->
  <div class="island">
    <div id="pill" class="pill">

      <!-- ===== Collapsed ===== -->
      <div class="collapsed-view">
        <div class="wings">
          <div class="wing wing-left">
            <img class="art art-mini media-wing" alt="">
            <span class="stat stat-wing left-battery"><span id="wing-battery-icon"></span><span id="wing-battery"></span></span>
            <span class="stat stat-wing left-weather"><span id="wing-weather-icon"></span><span id="wing-weather"></span></span>
            <span id="wing-date" class="stat stat-wing left-date"></span>
          </div>
          <span id="clock-small" class="clock-small">--:--</span>
          <div class="wing wing-right">
            <div class="bars media-wing"><i></i><i></i><i></i><i></i></div>
            <span class="stat stat-wing"><span id="wing-volume-icon"></span><span id="wing-volume"></span></span>
            <span class="stat timer-wing"><svg class="glyph" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 2M9.5 3h5"/></svg><span id="wing-timer"></span></span>
          </div>
        </div>

        <!-- Briefly replaces the wings when volume or charging changes -->
        <div class="peek">
          <span id="peek-icon" class="peek-icon"></span>
          <div class="peek-track"><div id="peek-fill" class="peek-fill"></div></div>
          <span id="peek-value" class="peek-value"></span>
        </div>

        <!-- Bluetooth device connected / disconnected -->
        <div class="device">
          <svg class="device-icon" viewBox="0 0 24 24"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></svg>
          <span class="device-label"><span id="device-name"></span><span id="device-status"></span></span>
          <span class="device-dot"></span>
        </div>

        <!-- Charger plugged in / unplugged: bolt, "Charging" or "On battery", battery -->
        <div class="charge">
          <svg class="charge-bolt" viewBox="0 0 24 24"><path d="M13.5 2 4.5 13.5H11L10 22l9-11.5h-6.5z"/></svg>
          <span class="charge-label"><span id="charge-text">Charging</span> <span id="charge-pct"></span></span>
          <span id="charge-battery" class="charge-battery"></span>
        </div>
      </div>

      <!-- ===== Expanded: one view at a time, scroll to switch ===== -->
      <div class="expanded-view">

        <section class="view" data-view="overview">
          <div class="ov-top">
            <div>
              <div id="clock-large" class="clock-large">--:--</div>
              <div id="date" class="date"></div>
              <div id="ov-weather" class="ov-weather"></div>
            </div>
            <div class="ov-battery battery-only">
              <span id="ov-battery-icon" class="ov-battery-icon"></span>
              <div>
                <div id="ov-battery" class="ov-battery-pct"></div>
                <div id="ov-battery-status" class="sub"></div>
              </div>
            </div>
          </div>
          <div class="slider-row volume-row">
            <button class="ctrl ctrl-small mute-btn" title="Mute"><span class="mute-icon"></span></button>
            <input class="slider volume-slider" type="range" min="0" max="100" step="1" value="0">
            <span class="sub row-value volume-value"></span>
          </div>
        </section>

        <section class="view" data-view="command">
          <div class="tiles">
            <button id="tile-wifi" class="tile">
              <svg class="glyph" viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1.2" fill="currentColor"/></svg>
              <span class="tile-text"><span class="tile-title">Wi-Fi</span><span id="tile-wifi-sub" class="tile-sub"></span></span>
            </button>
            <button id="tile-bluetooth" class="tile">
              <svg class="glyph" viewBox="0 0 24 24"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></svg>
              <span class="tile-text"><span class="tile-title">Bluetooth</span><span id="tile-bluetooth-sub" class="tile-sub"></span></span>
            </button>
            <button id="tile-tuck" class="tile" title="When the island tucks away: over browsers, over any app, or never">
              <svg class="glyph" viewBox="0 0 24 24"><path d="M4 4h16M12 20V9m-4 4 4-4 4 4"/></svg>
              <span class="tile-text"><span class="tile-title">Auto-hide</span><span id="tile-tuck-sub" class="tile-sub"></span></span>
            </button>
          </div>
          <div class="shortcuts">
            <button class="ctrl ctrl-small" data-shortcut="island" title="Dynamic Island settings">
              <svg class="glyph" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
            </button>
            <button class="ctrl ctrl-small" data-shortcut="nightlight" title="Night light settings">
              <svg class="glyph" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
            </button>
            <button class="ctrl ctrl-small" data-shortcut="power" title="Power &amp; battery settings">
              <svg class="glyph" viewBox="0 0 24 24"><rect x="3" y="7" width="16" height="10" rx="2.5"/><path d="M21.5 10.5v3M11.5 9l-2 3h3l-2 3"/></svg>
            </button>
            <button class="ctrl ctrl-small" data-shortcut="snip" title="Screenshot">
              <svg class="glyph" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.8"/><circle cx="6" cy="18" r="2.8"/><path d="M8.4 7.6 20 18M8.4 16.4 20 6"/></svg>
            </button>
            <button class="ctrl ctrl-small" data-shortcut="lock" title="Lock">
              <svg class="glyph" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg>
            </button>
            <button class="ctrl ctrl-small" data-shortcut="settings" title="Windows Settings">
              <svg class="glyph" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
            </button>
          </div>
          <div class="slider-row volume-row">
            <button class="ctrl ctrl-small mute-btn" title="Mute"><span class="mute-icon"></span></button>
            <input class="slider volume-slider" type="range" min="0" max="100" step="1" value="0">
            <span class="sub row-value volume-value"></span>
          </div>
          <div id="brightness-row" class="slider-row brightness-row">
            <span class="row-icon">
              <svg class="glyph" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
            </span>
            <input id="brightness-slider" class="slider" type="range" min="0" max="100" step="1" value="0">
            <span id="brightness-value" class="sub row-value"></span>
          </div>
        </section>

        <section class="view" data-view="media">
          <div class="media-header">
            <span id="clock-header" class="clock-header">--:--</span>
            <span id="date-header" class="date-header"></span>
          </div>
          <div class="track">
            <img class="art art-large" alt="">
            <div class="track-text">
              <div id="track-title" class="track-title"></div>
              <div id="track-artist" class="track-artist"></div>
              <div id="track-app" class="track-app"></div>
            </div>
            <div class="bars bars-large"><i></i><i></i><i></i><i></i></div>
          </div>
          <div id="progress" class="progress">
            <span id="elapsed" class="time">0:00</span>
            <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
            <span id="remaining" class="time">-0:00</span>
          </div>
          <div class="controls">
            <button id="btn-lyrics" class="ctrl ctrl-small lyrics-btn" title="Lyrics">
              <svg class="glyph" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12.5h5"/></svg>
            </button>
            <button id="btn-prev" class="ctrl" title="Previous">
              <svg viewBox="0 0 24 24"><path d="M11 7.5v9L4.5 12zM19.5 7.5v9L13 12z"/></svg>
            </button>
            <button id="btn-toggle" class="ctrl ctrl-main" title="Play/Pause">
              <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 6v12l10-6z"/></svg>
              <svg class="icon-pause" viewBox="0 0 24 24"><path d="M7 5.5h3v13H7zM14 5.5h3v13h-3z"/></svg>
            </button>
            <button id="btn-next" class="ctrl" title="Next">
              <svg viewBox="0 0 24 24"><path d="M13 7.5v9l6.5-4.5zM4.5 7.5v9L11 12z"/></svg>
            </button>
            <button id="btn-ambient" class="ctrl ctrl-small ambient-btn" title="Now Playing screen (Ctrl+Alt+M)">
              <svg class="glyph" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20h6M12 16.5V20"/></svg>
            </button>
          </div>

          <!-- Slides out to the right of the media card when lyrics are on -->
          <div id="lyrics" class="lyrics">
            <div id="lyrics-lines" class="lyrics-lines"></div>
            <div id="lyrics-status" class="lyrics-status"></div>
          </div>
        </section>

        <section class="view" data-view="calendar">
          <div class="calendar">
            <div class="cal-header">
              <button id="cal-prev" class="ctrl ctrl-tiny" title="Previous month">
                <svg class="glyph" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
              </button>
              <button id="cal-title" class="cal-title" title="Back to today"></button>
              <button id="cal-next" class="ctrl ctrl-tiny" title="Next month">
                <svg class="glyph" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
              </button>
            </div>
            <div id="cal-weekdays" class="cal-grid cal-weekdays"></div>
            <div id="cal-days" class="cal-grid cal-days"></div>
          </div>
          <div class="timer">
            <div id="timer-display" class="timer-display wheel-target" title="Scroll to change the time">5:00</div>
            <div class="timer-buttons">
              <button id="timer-start" class="chip chip-primary">Start</button>
              <button id="timer-reset" class="chip">Reset</button>
            </div>
            <div class="timer-presets">
              <button class="chip" data-minutes="5">5m</button>
              <button class="chip" data-minutes="15">15m</button>
              <button class="chip" data-minutes="25">25m</button>
              <button class="chip" data-minutes="50">50m</button>
            </div>
          </div>
        </section>

        <section class="view" data-view="notes">
          <div class="notes-header">
            <span class="notes-title">Notes</span>
            <span id="notes-status" class="sub"></span>
          </div>
          <textarea id="notes" class="notes" placeholder="Jot something down…" spellcheck="true"></textarea>
        </section>

        <div id="view-dots" class="view-dots"></div>
      </div>
    </div>
  </div>
  <script src="widgets/flip.js"></script>
  <script src="renderer.js"></script>
  <script src="widgets/time.js"></script>
  <script src="widgets/notes.js"></script>
  <script src="widgets/lrc.js"></script>
  <script src="widgets/lyrics.js"></script>
</body>
</html>
